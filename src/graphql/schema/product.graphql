type Image {
  url: String
  blurDataURL: String
}

type Product {
  id: ID!
  name: String!
  slug: String!
  available: Boolean
  colors: [String!]
  discount: Float
  likes: Int
  price: Float
  priceSale: Float
  averageRating: Float
  vendor: String
  shop: String
  createdAt: String
  image: Image
  
  id: ID!
  name: String!
  slug: String!
  price: Float!
  priceSale: Float!
  available: Boolean!
  colors: [String!]
  sizes: [String!]
  discount: Float
  averageRating: Float
  createdAt: DateTime!
  shop: Shop
  brand: Brand
  category: Category
}

type ProductResponse {
  success: Boolean!
  data: [Product!]!
  total: Int!
  count: Int!
}

input ProductFilterInput {
  page: Int
  limit: Int
  brand: String
  sizes: String
  colors: String
  prices: String
  date: Int
  price: Int
  name: Int
  top: Int
  gender: String
  isFeatured: Boolean
  rate: Float
}

type Query {
  getProducts(filter: ProductFilterInput): ProductResponse!
}


type PaginatedProducts {
  products: [Product!]!
  total: Int!
  count: Int!
}

type Query {
  getProductsByCategory(
    categorySlug: String!
    brandSlug: String
    sizes: [String!]
    colors: [String!]
    minPrice: Float
    maxPrice: Float
    isFeatured: Boolean
    gender: [String!]
    sortBy: String
    sortOrder: Int
    page: Int
    limit: Int
  ): PaginatedProducts!
}
