scalar DateTime

enum Role {
  SUPER_ADMIN
  ADMIN
  USER
  VENDOR
}

enum Gender {
  MALE
  FEMALE
  OTHER
}

type User {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  gender: Gender
  coverId: String
  coverUrl: String
  coverBlurDataURL: String
  phone: String
  status: String
  address: String
  city: String
  zip: String
  country: String
  state: String
  about: String
  isVerified: Boolean!
  otp: String
  commission: Float
  role: Role!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Order {
  id: ID!
  total: Float!
  createdAt: DateTime!
}

type UserOrdersResult {
  user: User!
  orders: [Order!]!
  count: Int!
}

type InvoiceResult {
  success: Boolean!
  orders: [Order!]!
  count: Int!
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  user: User!
}

input RegisterInput {
  firstName: String!
  lastName: String!
  email: String!
  password: String!
  gender: Gender
  phone: String
  address: String
  city: String
  zip: String
  country: String
  state: String
  about: String
  role: Role
}

input LoginInput {
  email: String!
  password: String!
}

input UpdateUserInput {
  firstName: String
  lastName: String
  phone: String
  address: String
  city: String
  zip: String
  country: String
  state: String
  about: String
  coverUrl: String
  coverId: String
  coverBlurDataURL: String
}

type Query {
  userByAdmin(id: ID!, page: Int, limit: Int): UserOrdersResult!
  invoice(page: Int, limit: Int): InvoiceResult!
  me: User!
}

type Mutation {
  registerUser(input: RegisterInput!): AuthPayload!
  loginUser(input: LoginInput!): AuthPayload!
  forgetPassword(email: String!, origin: String!): AuthPayload!
  resetPassword(token: String!, newPassword: String!): AuthPayload!
  verifyOtp(email: String!, otp: String!): AuthPayload!
  resendOtp(email: String!): AuthPayload!
  updateUser(data: UpdateUserInput!): User!
  changePassword(
    password: String!
    newPassword: String!
    confirmPassword: String!
  ): String!
}
